name: ci

on:
  push:
  pull_request:
  # The live conformance check needs a model session: run it by hand after a Claude
  # Code update (needs the ANTHROPIC_API_KEY secret).
  workflow_dispatch:
    inputs:
      conformance:
        description: Run scripts/conformance.py against the latest Claude Code
        type: boolean
        default: false

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      # Pinned, so a new clippy lint cannot break the build; bump it on purpose.
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: make check
        shell: bash
        run: |
          set -o pipefail
          if ! make check 2>&1 | tee check.log; then
            # The job log needs a GitHub login; annotations do not. Put each failure
            # (the panic line and the two lines after it) into one.
            awk '/panicked at|^error(\[|:)/ { n = 3; msg = "" }
                 n > 0 { msg = msg (msg == "" ? "" : "%0A") $0; n--; if (n == 0) print "::error::" msg }' check.log | head -20
            exit 1
          fi
      - run: python3 -m py_compile scripts/*.py
      - run: python3 scripts/changelog.py --check

  audit:
    # belay audit on this repo's own changes (experimental; reports, never fails).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - uses: ./

  sandbox:
    # `belay sandbox` end to end with bubblewrap. The check job runs the same tests, but
    # they skip themselves where bwrap is missing (every runner without this job's setup),
    # so this is the job that proves the sandbox works. Linux only: there is no macOS
    # backend, and the tests skip there.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Allow unprivileged user namespaces
        # Ubuntu 24.04 blocks unprivileged user namespaces through AppArmor, and the
        # apt bwrap is not setuid, so every sandbox test would skip. We relax the sysctl
        # rather than skip the job: the runner VM is thrown away after the job, and a job
        # that skips proves nothing. CI only: belay never changes this on a user's machine;
        # `belay sandbox doctor` tells the user instead.
        run: |
          knob=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          if [ -r "$knob" ] && [ "$(cat "$knob")" != 0 ]; then
            echo "AppArmor restricts unprivileged user namespaces here: relaxing it for this job."
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          # The tests skip quietly when bwrap cannot run; here that is a failure.
          if ! bwrap --unshare-user --unshare-pid --ro-bind / / true; then
            echo "::error::bwrap still cannot make user namespaces; the sandbox tests would only skip."
            exit 1
          fi
      - run: cargo build
      - run: cargo test -p belay-cli --test sandbox -- --nocapture
      - run: ./target/debug/belay sandbox doctor

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.87.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked

  latency:
    # Rule 7: shim p95 under 20 ms, with a release build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release -p belay-cli --test e2e -- --ignored shim_latency --nocapture

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked
      - name: 60 s per target
        working-directory: fuzz
        run: |
          for t in shell output guard; do
            cargo fuzz run "$t" -- -max_total_time=60 -max_len=4096
          done

  conformance:
    if: github.event_name == 'workflow_dispatch' && inputs.conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - run: npm install -g @anthropic-ai/claude-code
      - run: pip install pytest
      - run: cargo build
      - run: python3 scripts/conformance.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
