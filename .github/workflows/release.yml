name: release

# Push a tag like v0.2.0: build belay for Linux and macOS and attach the binaries to a
# GitHub release, so people can try belay without Rust.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  versions:
    # The tag, the workspace version, and the plugin version must agree, or users get a
    # binary and a plugin that say different things.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check changelog fragments
        run: python3 scripts/changelog.py --check
      - name: Check versions
        run: |
          cargo=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version *= *"\(.*\)"/\1/p' Cargo.toml)
          plugin=$(jq -r .version plugin/.claude-plugin/plugin.json)
          echo "tag $GITHUB_REF_NAME, Cargo.toml $cargo, plugin.json $plugin"
          if [ -z "$cargo" ] || [ "$cargo" != "$plugin" ]; then
            echo "::error::plugin/.claude-plugin/plugin.json is $plugin but the workspace version in Cargo.toml is $cargo."
            exit 1
          fi
          if [ "$GITHUB_REF_NAME" != "v$cargo" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the workspace version v$cargo."
            exit 1
          fi

  build:
    needs: versions
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p belay-cli
      - name: Package
        shell: bash
        run: |
          name="belay-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/belay" README.md LICENSE "$name/"
          cp -r plugin "$name/"
          tar czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: belay-*.tar.gz*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" belay-*.tar.gz* --repo "$GITHUB_REPOSITORY" --title "belay $GITHUB_REF_NAME" --generate-notes
