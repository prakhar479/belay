[package]
name = "belay-cli"
description = "Local supervisor for command-line coding agents."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[[bin]]
name = "belay"
path = "src/main.rs"

[dependencies]
belay-core.workspace = true
anyhow.workspace = true
clap.workspace = true
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
# Fleet files (F3a). The old clash with the `winnow` crate ended when the tool stopped being called winnow.
toml = { version = "0.8", default-features = false, features = ["parse"] }

# `cargo binstall`: the tarballs .github/workflows/release.yml attaches to each release.
# Each holds one top-level directory, named like the tarball, with the binary in it.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/belay-v{ version }-{ target }.tar.gz"
bin-dir = "belay-v{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"
