<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="belay">
  <title>belay</title>
  <!-- One rope: down the stem, round the bowl, and once over itself. The line is continuity; the loop is the catch. -->
  <defs>
    <linearGradient id="belay-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b4f8dc"/>
      <stop offset=".5" stop-color="#3ee6b4"/>
      <stop offset="1" stop-color="#1fb8d6"/>
    </linearGradient>
    <mask id="belay-gap" maskUnits="userSpaceOnUse" x="0" y="0" width="32" height="32">
      <rect width="32" height="32" fill="#fff"/>
      <path d="M13.2 16.3 C11 17.8 9 20.5 7.5 23.5" fill="none" stroke="#000" stroke-width="5.6" stroke-linecap="round"/>
    </mask>
  </defs>
  <path mask="url(#belay-gap)" d="M11.5 3 V22 C11.5 27.5 16.5 29.5 20.5 28 C25 26.3 26 20 22.5 16.5 C19 13 13.5 14 10.5 18.5" fill="none" stroke="url(#belay-g)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M13.2 16.3 C11 17.8 9 20.5 7.5 23.5" fill="none" stroke="url(#belay-g)" stroke-width="3.2" stroke-linecap="round"/>
</svg>
